name: Validate PR on QA branch with AI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [QA]
    paths:
      - 'force-app/**'

jobs:
  validate-deployment-on-QA-org:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:

      - uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #######################################################
      # EXISTING PR BODY PARSING
      #######################################################

      - name: Read PR Body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr_body.txt
          node ./parsePR.js
          TESTS=$(cat testsToRun.txt)
          echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV

      #######################################################
      # INSTALL PYTHON FOR AI SCRIPTS
      #######################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI Package
        run: |
          pip install openai

      #######################################################
      # INSTALL SALESFORCE CLI
      #######################################################

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global

      - name: Installing sfdx git delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta

      - name: Installing java
        run: |
          sudo apt-get update
          sudo apt install default-jdk -y

      #######################################################
      # AUTHENTICATION
      #######################################################

      - name: Populate auth file with QA Org secret
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > SFDX_AUTH_URL.txt

      - name: Authenticate to QA Org
        run: |
          sf org login sfdx-url \
          --sfdx-url-file SFDX_AUTH_URL.txt \
          --alias QA

      #######################################################
      # DELTA PACKAGE CREATION
      #######################################################

      - name: Create delta packages
        run: |
          mkdir changed-sources

          sf sgd source delta \
          --to HEAD \
          --from HEAD^ \
          --output-dir changed-sources \
          --generate-delta \
          --source force-app

      #######################################################
      # GET CHANGED FILES
      #######################################################

      - name: Capture Changed Metadata
        run: |
          git diff --name-only HEAD^ HEAD > changedFiles.txt
          cat changedFiles.txt

      #######################################################
      # AI IMPACT ANALYSIS
      #######################################################

      - name: Run AI Impact Analysis
        continue-on-error: true
        run: |
          python scripts/impact_analysis.py

      #######################################################
      # AI TEST CLASS RECOMMENDATION
      #######################################################

      - name: AI Test Recommendation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/recommend_tests.py

          TESTS=$(cat ai_tests.txt)

          if [ ! -z "$TESTS" ]; then
            echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV
          fi

      #######################################################
      # AI RISK ANALYSIS
      #######################################################

      - name: Risk Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/risk_analysis.py

      - name: Block High Risk Changes
        run: |
          SCORE=$(cat risk_score.txt)

          echo "Risk Score = $SCORE"

          if [ "$SCORE" -gt 8 ]; then
            echo "Deployment blocked because risk score > 8"
            exit 1
          fi

      #######################################################
      # DEPLOY VALIDATION
      #######################################################

      - name: Validate Deployment using AI tests
        if: ${{ env.APEX_TESTS != 'All' }}
        run: |
          echo ${{ env.APEX_TESTS }}

          sf project deploy validate \
          --source-dir changed-sources/force-app \
          --target-org QA \
          --test-level RunSpecifiedTests \
          --tests "${{ env.APEX_TESTS }}"

      - name: Validate Deployment NoTestRun
        if: ${{ env.APEX_TESTS == 'All' }}
        run: |
          sf project deploy validate \
          --source-dir changed-sources/force-app \
          --target-org QA \
          --test-level NoTestRun

      #######################################################
      # AI RELEASE NOTES
      #######################################################

      - name: Generate AI Release Notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/release_notes.py

      #######################################################
      # PUBLISH RESULTS
      #######################################################

      - name: Publish AI Summary
        run: |
          cat ai-analysis.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          cat release_notes.md >> $GITHUB_STEP_SUMMARY
